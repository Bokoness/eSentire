server {
  listen 80;
  root /usr/share/nginx/html;

  # Same-origin API: the browser calls /api, nginx forwards it to the api service.
  location /api/ {
    proxy_pass http://api:3001;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Vue Router uses HTML5 history mode: unknown paths (e.g. /entities/<id>) serve index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
